services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sjh-postgres
    environment:
      POSTGRES_DB: sports_jersey_house
      POSTGRES_USER: sjh
      POSTGRES_PASSWORD: sjh
    ports:
      - "5432:5432"
    volumes:
      - sjh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjh -d sports_jersey_house"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sjh-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sjh-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: sjh-minio
    environment:
      MINIO_ROOT_USER: sjh-local
      MINIO_ROOT_PASSWORD: sjh-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - sjh-minio-data:/data

volumes:
  sjh-postgres-data:
  sjh-redis-data:
  sjh-minio-data:
